# Subflow: mở dev client, nạp bundle từ Metro, đăng nhập bằng OTP (Mailpit) nếu chưa có phiên.
# Dùng: - runFlow: login.yaml  (cần env EMAIL)
appId: com.anchor.app
---
# Xoá trạng thái để luôn đi qua đăng nhập. Dev client mở màn chọn server → chạm vào Metro (cổng 8081).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "http://.*:8081"
    timeout: 20000
# Nạp bundle qua 127.0.0.1 (adb reverse 8081) thay vì IP LAN mà dev client tự dò: chế độ máy bay
# không cắt loopback → LogBox "mất Metro" không đè lên nút khi kiểm offline.
- openLink: "exp+anchor://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
# Lần đầu sau clearState, dev client hiện hướng dẫn developer menu.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "signin-email"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        id: "signin-email"
    commands:
      - tapOn:
          id: "signin-email"
      - inputText: "${EMAIL}"
      - tapOn:
          id: "signin-send"
      - extendedWaitUntil:
          visible:
            id: "signin-code"
          timeout: 15000
      - runScript:
          file: otp.js
          env:
            EMAIL: ${EMAIL}
      - tapOn:
          id: "signin-code"
      - inputText: "${output.otp}"
      - tapOn:
          id: "signin-verify"
