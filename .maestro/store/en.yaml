# G7.7 — English parameters (see vi.yaml).
appId: com.anchor.app
env:
  DOC: en_attention
  QUESTION: "What is the dimension d_model used in the base model?"
  EXPECT: "512"
  ESSAY: "The Transformer drops recurrence entirely and relies on self-attention. The base model uses d_model = 512 with 6 identical layers in both encoder and decoder, and multi-head attention with 8 heads. Positional encodings are added to the input embeddings so the model can use the order of the sequence. Training on WMT 2014 English-German took about 12 hours on 8 P100 GPUs."
---
# runFlow không nhận đường dẫn có biến → chọn bằng `when`.
- runFlow:
    when:
      true: ${FLOW == 'library'}
    file: library.yaml
- runFlow:
    when:
      true: ${FLOW == 'ask'}
    file: ask.yaml
- runFlow:
    when:
      true: ${FLOW == 'quiz'}
    file: quiz.yaml
- runFlow:
    when:
      true: ${FLOW == 'study'}
    file: study.yaml
- runFlow:
    when:
      true: ${FLOW == 'essay'}
    file: essay.yaml
- runFlow:
    when:
      true: ${FLOW == 'video'}
    file: video.yaml
