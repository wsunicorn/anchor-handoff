name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # chạy tay cổng rag-gate (tốn hạn mức Gemini, không chạy trên mọi PR)
    inputs:
      only:
        description: 'EVAL_ONLY — chỉ chạy vài id (vd vi-001,en-003) để thử đường ống'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # đọc bản pnpm từ "packageManager" trong package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check-i18n
      - run: pnpm check-design

  # Cách ly dữ liệu giữa tài khoản (G0.7). Chạy Supabase thật trong CI: RLS sai là lỗi
  # bảo mật, không được chỉ tin vào máy dev.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0 # ghim = devDependency `supabase`; `latest` hỏi GitHub API không token → "rate limit exceeded" (18/9)
      - run: supabase start -x logflare,vector,imgproxy,supavisor,realtime,studio,edge-runtime
      - run: pnpm test:rls
      - if: always()
        run: supabase stop --no-backup

  # services/ingest: chunking thuần + PDF/OCR trên fixture sinh sẵn (G1.1–G1.4).
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ingest/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng
      - run: pip install -r requirements.txt
      - run: python scripts/make_fixtures.py
      - run: python -m pytest -q
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata  # CI: gói apt (fast hơn) đủ để test luồng OCR

  # Cổng chất lượng RAG (G3.7). Dựng cả stack ngay trên runner: Supabase local + `functions serve`
  # + services/ingest + 6 PDF thật (cache theo fetch.sh) rồi `pnpm eval:gate`. Ngưỡng ở docs/SPEC.md §7.
  # Fail ở đây là chặn phát hành, không phải cảnh báo. Chạy khi push main với repo variable
  # RAG_GATE_ENABLED=true, hoặc chạy tay (workflow_dispatch). Secret cần: LLM_PROVIDER_API_KEY.
  rag-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.RAG_GATE_ENABLED == 'true')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Mỗi lượt ~200 lời gọi Gemini (free tier 500/ngày/model) → chỉ chạy khi push đụng tới pipeline
      # RAG; commit chỉ sửa docs/app/TASKS.md thì bỏ qua. Chạy tay (workflow_dispatch) luôn chạy.
      - id: relevant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Eq '^(supabase/|eval/|services/ingest/|scripts/rag-gate-ci.sh|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Không đụng pipeline RAG — bỏ qua rag-gate."; echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.relevant.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.relevant.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ingest/requirements.txt
      - if: steps.relevant.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng
      - if: steps.relevant.outputs.run == 'true'
        run: pip install -r services/ingest/requirements.txt
      - if: steps.relevant.outputs.run == 'true'
        uses: actions/cache@v4
        id: samples
        with:
          path: docs/samples/*.pdf
          key: samples-${{ hashFiles('docs/samples/fetch.sh') }}
      - if: steps.relevant.outputs.run == 'true' && steps.samples.outputs.cache-hit != 'true'
        run: PYTHON=python bash docs/samples/fetch.sh
      - if: steps.relevant.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0 # ghim = devDependency `supabase`; `latest` hỏi GitHub API không token → "rate limit exceeded" (18/9)
      - if: steps.relevant.outputs.run == 'true'
        run: supabase start -x logflare,vector,imgproxy,supavisor,realtime,studio,edge-runtime
      - if: steps.relevant.outputs.run == 'true'
        run: mkdir -p eval/out && bash scripts/rag-gate-ci.sh
        env:
          LLM_PROVIDER_API_KEY: ${{ secrets.LLM_PROVIDER_API_KEY }}
          LLM_MODEL_ANSWER: ${{ vars.LLM_MODEL_ANSWER }}
          LLM_MODEL_VERIFY: ${{ vars.LLM_MODEL_VERIFY }}
          LLM_MODEL_RERANK: ${{ vars.LLM_MODEL_RERANK }}
          EVAL_LABEL: ci-${{ github.sha }}
          EVAL_ONLY: ${{ inputs.only }}
      - if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-${{ github.run_id }}
          path: eval/out/
          if-no-files-found: ignore
      - if: always() && steps.relevant.outputs.run == 'true'
        run: supabase stop --no-backup
