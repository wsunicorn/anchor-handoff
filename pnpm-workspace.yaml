# React Native/Expo cần node_modules phẳng (không symlink): CMake/ninja trên Windows
# thấy hai đường dẫn khác nhau cho cùng một file qua junction và báo "build.ninja still dirty".
nodeLinker: hoisted

# pnpm chặn postinstall mặc định và trên CI (CI=true) coi gói chưa duyệt là lỗi
# ERR_PNPM_IGNORED_BUILDS — nên mọi gói có script phải được khai rõ true/false ở đây.
allowBuilds:
  '@sentry/cli': true # tải binary để upload sourcemap lúc build
  esbuild: true # runtime của tsx
  unrs-resolver: false # đã có binary theo nền tảng qua optionalDependencies

minimumReleaseAgeExclude:
  - expo-image-manipulator@57.0.18
  - expo-image-picker@57.0.18
